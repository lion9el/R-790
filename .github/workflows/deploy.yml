# Déploiement automatisé SocialNet
# - build image Docker
# - push vers GitHub Container Registry (ghcr.io)
# - optionnel : redéploiement SSH si secrets configurés

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Raison du déploiement manuel"
        required: false
        default: "manual"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Extension C
        run: python setup.py build_ext --inplace
        working-directory: c_ext
      - name: Tests C
        run: python -m pytest -q
        working-directory: c_ext
      - name: Tests API
        run: python -m pytest -q
        working-directory: backend

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Déploiement distant optionnel (VPS / serveur)
  # Secrets requis : DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
  remote:
    needs: docker
    runs-on: ubuntu-latest
    if: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH || '~/socialnet' }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            docker pull ghcr.io/${{ github.repository }}:latest
            docker compose pull || true
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "Deploy OK $(date -u)"

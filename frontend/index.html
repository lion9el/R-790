<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SOCIALNET // terminal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --amber: #ffb000;
    --amber-dim: #a86e00;
    --amber-faint: #5c3d00;
    --bg: #0d0900;
    --bg-panel: #161005;
    --red: #ff5f4d;
    --font: "JetBrains Mono", "IBM Plex Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--amber);
    font-family: var(--font); font-size: 15px; overflow: hidden;
  }
  #crt {
    height: 100%; display: flex; flex-direction: column;
    position: relative;
  }
  #crt::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px,
      rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 3px
    );
    mix-blend-mode: multiply;
  }
  #crt::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 6;
    background: radial-gradient(ellipse at center, rgba(255,176,0,0.05) 0%, rgba(0,0,0,0.35) 100%);
  }
  header {
    padding: 10px 18px; border-bottom: 1px solid var(--amber-faint);
    display: flex; justify-content: space-between; align-items: baseline;
    text-shadow: 0 0 6px rgba(255,176,0,0.5);
  }
  header .brand { font-weight: 700; letter-spacing: 3px; }
  header .who { color: var(--amber-dim); font-size: 13px; }
  #screen {
    flex: 1; overflow-y: auto; padding: 14px 18px;
    text-shadow: 0 0 4px rgba(255,176,0,0.35);
  }
  #screen::-webkit-scrollbar { width: 10px; }
  #screen::-webkit-scrollbar-thumb { background: var(--amber-faint); }
  .line { white-space: pre-wrap; word-break: break-word; line-height: 1.5; margin: 2px 0; }
  .line.cmd { color: #fff; opacity: 0.85; }
  .line.cmd::before { content: "» "; color: var(--amber-dim); }
  .line.err { color: var(--red); }
  .line.dim { color: var(--amber-dim); }
  .post {
    border-left: 2px solid var(--amber-faint); padding: 4px 10px; margin: 8px 0;
  }
  .post .meta { color: var(--amber-dim); font-size: 12px; }
  .post .content { color: var(--amber); }
  .post .content .hashtag {
    color: #fff; cursor: pointer; text-decoration: underline dotted var(--amber-dim);
  }
  .post .content .hashtag:hover { text-decoration-style: solid; }
  .post .content .mention { color: #fff; font-weight: 600; }
  .post .post-image {
    max-width: 320px; max-height: 320px; margin-top: 6px;
    border: 1px solid var(--amber-faint); display: block;
    filter: sepia(30%) saturate(150%) hue-rotate(-10deg);
  }
  #inputRow {
    display: flex; align-items: center; padding: 10px 18px;
    border-top: 1px solid var(--amber-faint); background: var(--bg-panel);
  }
  #prompt { color: var(--amber); margin-right: 6px; white-space: nowrap; }
  #cmdInput {
    flex: 1; background: transparent; border: none; outline: none;
    color: #fff; font-family: var(--font); font-size: 15px;
    caret-color: var(--amber);
  }
  #cmdInput::placeholder { color: var(--amber-faint); }
  .blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="crt">
  <header>
    <span class="brand">SOCIALNET_</span>
    <span class="who" id="whoami">non connecté — tape <b>help</b></span>
  </header>
  <div id="screen"></div>
  <div id="inputRow">
    <span id="prompt">guest&gt;</span>
    <input id="cmdInput" autocomplete="off" spellcheck="false" placeholder="tape une commande… (help pour la liste)" autofocus>
  </div>
  <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none">
</div>

<script>
const API = "";
let token = localStorage.getItem("sn_token") || null;
let username = localStorage.getItem("sn_username") || null;
let history = [];
let historyIdx = -1;

const screen = document.getElementById("screen");
const input = document.getElementById("cmdInput");
const prompt = document.getElementById("prompt");
const whoami = document.getElementById("whoami");
const fileInput = document.getElementById("fileInput");
let pendingPostText = null; // texte en attente pendant que l'utilisateur choisit une image (commande postimg)

// État de la pagination en cours (fil OU recherche, un seul à la fois : le
// second écrase le premier). `more` regarde ce champ pour savoir quoi
// continuer. `null` quand il n'y a rien à paginer (pas encore de feed/search
// lancé, ou dernière page déjà atteinte).
let pagination = null; // { type: "feed", limit, cursor } | { type: "search", limit, query, offset } | { type: "hashtag", limit, tag, cursor }

function print(text, cls) {
  const div = document.createElement("div");
  div.className = "line" + (cls ? " " + cls : "");
  div.textContent = text;
  screen.appendChild(div);
  screen.scrollTop = screen.scrollHeight;
}

function printHTML(html) {
  const div = document.createElement("div");
  div.innerHTML = html;
  screen.appendChild(div);
  screen.scrollTop = screen.scrollHeight;
}

function updateHeader() {
  prompt.textContent = (username || "guest") + ">";
  whoami.textContent = username ? ("connecté en tant que " + username) : "non connecté — tape help";
}
updateHeader();

// ---------- Temps réel (WebSocket) ----------
// Une seule connexion WebSocket, ouverte après login/register, fermée au
// logout. Le serveur y pousse deux types d'événements : "message" (message
// privé reçu) et "new_post" (nouveau post d'un compte suivi). Voir
// backend/realtime.py et la route /ws dans backend/app.py.
let socket = null;

function connectRealtime() {
  if (!token) return;
  if (socket) { try { socket.close(); } catch (e) {} }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  // Le jeton n'est PAS mis dans l'URL (`?token=...`) : un serveur ASGI comme
  // uvicorn logue par défaut le chemin complet AVEC sa query string, ce qui
  // ferait fuiter le jeton en clair dans les logs serveur (et ceux de tout
  // reverse-proxy devant). Il est envoyé comme premier message une fois la
  // connexion ouverte à la place — voir backend/app.py::websocket_endpoint.
  socket = new WebSocket(`${proto}://${location.host}/ws`);

  socket.onopen = () => {
    socket.send(JSON.stringify({ token }));
  };

  socket.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch (e) { return; }
    if (data.type === "message") {
      print(`💬 [temps réel] message de @${data.from}: ${data.content}`, "dim");
    } else if (data.type === "new_post") {
      print(`📰 [temps réel] nouveau post de @${data.post.author} — tape 'feed' pour le voir`, "dim");
    } else if (data.type === "notification") {
      print(`🔔 [temps réel] ${formatNotification(data.notification)}`, "dim");
    }
  };
  // Pas de reconnexion automatique pour l'instant : une perte de connexion
  // (ex: veille du PC) nécessite de retaper 'login'. Limitation connue,
  // voir CHANGELOG.md.
}

function disconnectRealtime() {
  if (socket) { try { socket.close(); } catch (e) {} socket = null; }
}

if (token) connectRealtime();

function banner() {
  print("═══════════════════════════════════════════════");
  print("  SOCIALNET v1.0 — interface terminal");
  print("  backend: FastAPI (Python) + moteur de recherche en C");
  print("═══════════════════════════════════════════════");
  print("Tape 'help' pour voir les commandes disponibles.", "dim");
  print("");
}
banner();

async function api(method, path, body, auth = true) {
  const headers = { "Content-Type": "application/json" };
  if (auth && token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(API + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const msg = (data && data.detail) ? data.detail : ("erreur HTTP " + res.status);
    throw new Error(msg);
  }
  return data;
}

// Comme api(), mais pour envoyer un FormData (texte + fichier) au lieu de
// JSON — nécessaire pour l'upload d'image. Pas de Content-Type manuel ici :
// le navigateur le calcule lui-même avec la "boundary" correcte pour le
// multipart, ce qui casserait si on le fixait à la main.
async function apiForm(method, path, formData) {
  const headers = {};
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(API + path, { method, headers, body: formData });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const msg = (data && data.detail) ? data.detail : ("erreur HTTP " + res.status);
    throw new Error(msg);
  }
  return data;
}

function fmtPost(p) {
  const liked = p.liked_by_me ? "♥" : "♡";
  const imageHtml = p.image_url
    ? `<img class="post-image" src="${escapeHtml(p.image_url)}" alt="image jointe">`
    : "";
  return `<div class="post">` +
    `<div class="meta">#${p.id} @${escapeHtml(p.author)} — ${fmtDate(p.created_at)}${p.score !== undefined ? " (score " + p.score + ")" : ""}</div>` +
    `<div class="content">${highlightTags(p.content)}</div>` +
    imageHtml +
    `<div class="meta">${liked} ${p.likes} likes · 💬 ${p.comments} commentaires</div>` +
    `</div>`;
}

// Met en évidence les #hashtags (cliquables : lancent la commande
// 'hashtag <tag>') et les @mentions dans le contenu d'un post ou commentaire.
// IMPORTANT : on échappe TOUJOURS le texte AVANT d'y chercher les motifs
// #/@, jamais après — sinon un post contenant par exemple "<script>@x"
// pourrait réintroduire du HTML non échappé. Les <span> ajoutés ensuite ne
// contiennent que des caractères qu'on contrôle nous-mêmes (le tag/pseudo
// déjà échappé), jamais de texte utilisateur brut réinjecté tel quel.
function highlightTags(text) {
  const escaped = escapeHtml(text);
  return escaped
    .replace(/#(\w{1,50})/gu, (match, tag) => `<span class="hashtag" onclick="runCommand('hashtag ${tag.toLowerCase()}')">${match}</span>`)
    .replace(/@(\w{1,30})/gu, (match) => `<span class="mention">${match}</span>`);
}

function fmtDate(iso) {
  try {
    const d = new Date(iso + "Z");
    return d.toLocaleString();
  } catch (e) { return iso; }
}

function formatNotification(n) {
  const when = fmtDate(n.created_at);
  if (n.type === "like") return `❤️ @${n.from} a aimé ton post #${n.post_id} — ${when}`;
  if (n.type === "follow") return `➕ @${n.from} te suit maintenant — ${when}`;
  if (n.type === "message") return `💬 @${n.from} t'a envoyé un message : ${n.content} — ${when}`;
  if (n.type === "mention") return `📣 @${n.from} t'a mentionné (post #${n.post_id}) : ${n.content} — ${when}`;
  return `🔔 notification de @${n.from} — ${when}`;
}

function escapeHtml(s) {
  // Échappe aussi les guillemets (pas seulement & < >) : `imageHtml` plus
  // haut insère `p.image_url` dans un attribut HTML (`src="..."`), pas
  // seulement dans du texte. Aujourd'hui image_url est toujours un nom de
  // fichier généré côté serveur (UUID), donc ce n'est pas exploitable en
  // pratique — mais si un champ moins contrôlé passe un jour par innerHTML
  // dans un contexte attribut, ne pas échapper les guillemets permettrait
  // d'en sortir (ex: `" onerror="alert(1)`) et d'injecter du JS.
  return s
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function requireAuth() {
  if (!token) { print("Tu dois être connecté. Utilise: login <user> <mdp>", "err"); return false; }
  return true;
}

const COMMANDS = {
  help() {
    print("Commandes disponibles :", "dim");
    print("  register <user> <mdp>        créer un compte");
    print("  login <user> <mdp>           se connecter");
    print("  logout                       se déconnecter");
    print("  whoami                       afficher l'utilisateur courant");
    print("  post <texte>                 publier un post");
    print("  postimg <texte>              publier un post avec une image jointe");
    print("  feed [n]                     afficher le fil d'actualité (n = taille de page, 30 par défaut)");
    print("  more                         voir la suite du dernier 'feed', 'search' ou 'hashtag'");
    print("  like <id>                    liker un post");
    print("  unlike <id>                  retirer son like");
    print("  comment <id> <texte>         commenter un post");
    print("  comments <id>                voir les commentaires d'un post");
    print("  edit <id> <texte>            modifier un de ses posts");
    print("  delete <id>                  supprimer un de ses posts");
    print("  delcomment <id>              supprimer un commentaire (le sien ou sur son post)");
    print("  follow <user>                suivre un utilisateur");
    print("  unfollow <user>              ne plus suivre");
    print("  profile <user>               voir un profil");
    print("  bio <texte>                  changer sa bio (sans texte : l'effacer)");
    print("  msg <user> <texte>           envoyer un message privé");
    print("  conv <user>                  voir une conversation");
    print("  inbox                        liste des conversations");
    print("  notifications                voir les notifications (likes, follows, messages)");
    print("  search <mots>                rechercher des posts (moteur C)");
    print("  hashtag <tag>                voir les posts contenant #tag");
    print("  trending                     hashtags les plus utilisés");
    print("  clear                        vider l'écran");
  },

  async register(args) {
    const [user, pass] = args;
    if (!user || !pass) return print("usage: register <user> <mdp>", "err");
    const data = await api("POST", "/api/register", { username: user, password: pass }, false);
    token = data.token; username = data.username;
    localStorage.setItem("sn_token", token); localStorage.setItem("sn_username", username);
    updateHeader();
    connectRealtime();
    print(`Compte créé. Bienvenue @${username} !`);
  },

  async login(args) {
    const [user, pass] = args;
    if (!user || !pass) return print("usage: login <user> <mdp>", "err");
    const data = await api("POST", "/api/login", { username: user, password: pass }, false);
    token = data.token; username = data.username;
    localStorage.setItem("sn_token", token); localStorage.setItem("sn_username", username);
    updateHeader();
    connectRealtime();
    print(`Connecté en tant que @${username}.`);
  },

  logout() {
    token = null; username = null;
    localStorage.removeItem("sn_token"); localStorage.removeItem("sn_username");
    disconnectRealtime();
    updateHeader();
    print("Déconnecté.");
  },

  whoami() {
    print(username ? `@${username}` : "non connecté");
  },

  async post(args) {
    if (!requireAuth()) return;
    const text = args.join(" ");
    if (!text) return print("usage: post <texte>", "err");
    const formData = new FormData();
    formData.append("content", text);
    const p = await apiForm("POST", "/api/posts", formData);
    print("Publié :");
    printHTML(fmtPost(p));
  },

  postimg(args) {
    if (!requireAuth()) return;
    const text = args.join(" ");
    if (!text) return print("usage: postimg <texte> (une fenêtre va s'ouvrir pour choisir l'image)", "err");
    pendingPostText = text;
    fileInput.click();
  },

  async feed(args) {
    if (!requireAuth()) return;
    const limit = parseInt(args[0]) || 30;
    const data = await api("GET", `/api/feed?limit=${limit}`);
    if (data.posts.length === 0) {
      pagination = null;
      return print("Fil vide. Suis des gens ou publie un post !", "dim");
    }
    data.posts.forEach(p => printHTML(fmtPost(p)));
    pagination = data.has_more ? { type: "feed", limit, cursor: data.next_cursor } : null;
    if (data.has_more) print("— tape 'more' pour voir la suite du fil —", "dim");
  },

  async like(args) {
    if (!requireAuth()) return;
    const id = args[0];
    if (!id) return print("usage: like <id>", "err");
    await api("POST", `/api/posts/${id}/like`);
    print(`Post #${id} liké.`);
  },

  async unlike(args) {
    if (!requireAuth()) return;
    const id = args[0];
    if (!id) return print("usage: unlike <id>", "err");
    await api("DELETE", `/api/posts/${id}/like`);
    print(`Like retiré du post #${id}.`);
  },

  async comment(args) {
    if (!requireAuth()) return;
    const id = args[0];
    const text = args.slice(1).join(" ");
    if (!id || !text) return print("usage: comment <id> <texte>", "err");
    await api("POST", `/api/posts/${id}/comments`, { content: text });
    print("Commentaire ajouté.");
  },

  async comments(args) {
    if (!requireAuth()) return;
    const id = args[0];
    if (!id) return print("usage: comments <id>", "err");
    const list = await api("GET", `/api/posts/${id}/comments`);
    if (list.length === 0) return print("Aucun commentaire.", "dim");
    list.forEach(c => print(`  #${c.id} @${c.author}: ${c.content}`));
  },

  async edit(args) {
    if (!requireAuth()) return;
    const id = args[0];
    const text = args.slice(1).join(" ");
    if (!id || !text) return print("usage: edit <id> <texte>", "err");
    const p = await api("PATCH", `/api/posts/${id}`, { content: text });
    print("Post modifié :");
    printHTML(fmtPost(p));
  },

  async delete(args) {
    if (!requireAuth()) return;
    const id = args[0];
    if (!id) return print("usage: delete <id>", "err");
    await api("DELETE", `/api/posts/${id}`);
    print(`Post #${id} supprimé.`);
  },

  async delcomment(args) {
    if (!requireAuth()) return;
    const id = args[0];
    if (!id) return print("usage: delcomment <id> (l'id s'affiche avec 'comments <id du post>')", "err");
    await api("DELETE", `/api/comments/${id}`);
    print(`Commentaire #${id} supprimé.`);
  },

  async follow(args) {
    if (!requireAuth()) return;
    const user = args[0];
    if (!user) return print("usage: follow <user>", "err");
    await api("POST", `/api/follow/${user}`);
    print(`Tu suis maintenant @${user}.`);
  },

  async unfollow(args) {
    if (!requireAuth()) return;
    const user = args[0];
    if (!user) return print("usage: unfollow <user>", "err");
    await api("DELETE", `/api/follow/${user}`);
    print(`Tu ne suis plus @${user}.`);
  },

  async profile(args) {
    if (!requireAuth()) return;
    const user = args[0];
    if (!user) return print("usage: profile <user>", "err");
    const p = await api("GET", `/api/users/${user}`);
    print(`@${p.username}`);
    print(`  bio: ${p.bio || "(vide)"}`);
    print(`  ${p.posts} posts · ${p.followers} followers · ${p.following} suivis`);
  },

  async bio(args) {
    if (!requireAuth()) return;
    const text = args.join(" ");
    const p = await api("PATCH", "/api/me", { bio: text });
    print(p.bio ? `Bio mise à jour : ${p.bio}` : "Bio effacée.");
  },

  async msg(args) {
    if (!requireAuth()) return;
    const user = args[0];
    const text = args.slice(1).join(" ");
    if (!user || !text) return print("usage: msg <user> <texte>", "err");
    await api("POST", "/api/messages", { to: user, content: text });
    print(`Message envoyé à @${user}.`);
  },

  async conv(args) {
    if (!requireAuth()) return;
    const user = args[0];
    if (!user) return print("usage: conv <user>", "err");
    const msgs = await api("GET", `/api/messages/${user}`);
    if (msgs.length === 0) return print("Aucun message.", "dim");
    msgs.forEach(m => print(`  [${fmtDate(m.created_at)}] @${m.from}: ${m.content}`));
  },

  async inbox() {
    if (!requireAuth()) return;
    const list = await api("GET", "/api/inbox");
    if (list.length === 0) return print("Boîte de réception vide.", "dim");
    list.forEach(c => print(`  @${c.with} ${c.unread > 0 ? "(" + c.unread + " non lus)" : ""}`));
  },

  async notifications() {
    if (!requireAuth()) return;
    const list = await api("GET", "/api/notifications");
    if (list.length === 0) return print("Aucune notification.", "dim");
    list.forEach(n => print(`  ${!n.is_read ? "● " : "  "}${formatNotification(n)}`));
  },

  async search(args) {
    if (!requireAuth()) return;
    const q = args.join(" ");
    if (!q) return print("usage: search <mots>", "err");
    const limit = 20;
    const data = await api("GET", `/api/search?q=${encodeURIComponent(q)}&limit=${limit}`);
    if (data.results.length === 0) {
      pagination = null;
      return print("Aucun résultat.", "dim");
    }
    data.results.forEach(p => printHTML(fmtPost(p)));
    pagination = data.has_more ? { type: "search", limit, query: q, offset: data.next_offset } : null;
    if (data.has_more) print("— tape 'more' pour voir la suite des résultats —", "dim");
  },

  async hashtag(args) {
    if (!requireAuth()) return;
    const tag = (args[0] || "").replace(/^#/, "").toLowerCase();
    if (!tag) return print("usage: hashtag <tag> (sans le #)", "err");
    const limit = 20;
    const data = await api("GET", `/api/hashtags/${encodeURIComponent(tag)}?limit=${limit}`);
    if (data.posts.length === 0) {
      pagination = null;
      return print(`Aucun post avec #${tag}.`, "dim");
    }
    data.posts.forEach(p => printHTML(fmtPost(p)));
    pagination = data.has_more ? { type: "hashtag", limit, tag, cursor: data.next_cursor } : null;
    if (data.has_more) print("— tape 'more' pour voir la suite —", "dim");
  },

  async trending() {
    if (!requireAuth()) return;
    const list = await api("GET", "/api/hashtags/trending");
    if (list.length === 0) return print("Aucun hashtag utilisé pour l'instant.", "dim");
    list.forEach((h, i) => print(`  ${i + 1}. #${h.hashtag} (${h.count} post${h.count > 1 ? "s" : ""})`));
  },

  async more() {
    if (!requireAuth()) return;
    if (!pagination) return print("Rien à continuer : lance d'abord 'feed', 'search' ou 'hashtag'.", "dim");

    if (pagination.type === "feed") {
      const { limit, cursor } = pagination;
      const data = await api("GET", `/api/feed?limit=${limit}&before=${cursor}`);
      if (data.posts.length === 0) {
        pagination = null;
        return print("Plus rien à afficher dans le fil.", "dim");
      }
      data.posts.forEach(p => printHTML(fmtPost(p)));
      pagination = data.has_more ? { type: "feed", limit, cursor: data.next_cursor } : null;
      if (data.has_more) print("— tape 'more' pour voir la suite du fil —", "dim");
    } else if (pagination.type === "search") {
      const { limit, query, offset } = pagination;
      const data = await api("GET", `/api/search?q=${encodeURIComponent(query)}&limit=${limit}&offset=${offset}`);
      if (data.results.length === 0) {
        pagination = null;
        return print("Plus aucun résultat.", "dim");
      }
      data.results.forEach(p => printHTML(fmtPost(p)));
      pagination = data.has_more ? { type: "search", limit, query, offset: data.next_offset } : null;
      if (data.has_more) print("— tape 'more' pour voir la suite des résultats —", "dim");
    } else if (pagination.type === "hashtag") {
      const { limit, tag, cursor } = pagination;
      const data = await api("GET", `/api/hashtags/${encodeURIComponent(tag)}?limit=${limit}&before=${cursor}`);
      if (data.posts.length === 0) {
        pagination = null;
        return print(`Plus rien avec #${tag}.`, "dim");
      }
      data.posts.forEach(p => printHTML(fmtPost(p)));
      pagination = data.has_more ? { type: "hashtag", limit, tag, cursor: data.next_cursor } : null;
      if (data.has_more) print("— tape 'more' pour voir la suite —", "dim");
    }
  },

  clear() {
    screen.innerHTML = "";
  },
};

async function runCommand(raw) {
  print(raw, "cmd");
  const parts = raw.trim().split(/\s+/);
  const cmdName = parts[0];
  const args = parts.slice(1);
  if (!cmdName) return;
  const fn = COMMANDS[cmdName];
  if (!fn) {
    print(`Commande inconnue: ${cmdName}. Tape 'help'.`, "err");
    return;
  }
  try {
    await fn(args);
  } catch (e) {
    print("Erreur: " + e.message, "err");
  }
  print("");
}

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const val = input.value;
    if (val.trim()) {
      history.push(val);
      historyIdx = history.length;
    }
    input.value = "";
    runCommand(val);
  } else if (e.key === "ArrowUp") {
    if (historyIdx > 0) { historyIdx--; input.value = history[historyIdx]; }
    e.preventDefault();
  } else if (e.key === "ArrowDown") {
    if (historyIdx < history.length - 1) { historyIdx++; input.value = history[historyIdx]; }
    else { historyIdx = history.length; input.value = ""; }
    e.preventDefault();
  }
});

document.addEventListener("click", () => input.focus());

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  fileInput.value = ""; // permet de resélectionner le même fichier plus tard
  if (!file || pendingPostText === null) return;
  const text = pendingPostText;
  pendingPostText = null;
  try {
    const formData = new FormData();
    formData.append("content", text);
    formData.append("image", file);
    print(`postimg ${text}`, "cmd");
    const p = await apiForm("POST", "/api/posts", formData);
    print("Publié avec image :");
    printHTML(fmtPost(p));
  } catch (e) {
    print("Erreur: " + e.message, "err");
  }
  print("");
  input.focus();
});

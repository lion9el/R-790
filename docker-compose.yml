# SocialNet
#
# SQLite (défaut) :
#   docker compose up --build
#
# Postgres live :
#   docker compose --profile postgres up --build
#   → socialnet reçoit DATABASE_URL=postgresql://...

services:
  socialnet:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - SOCIALNET_SECRET=${SOCIALNET_SECRET:-change-moi-avant-la-production}
      - SOCIALNET_BACKUP_DIR=/app/backups
      - SOCIALNET_BACKUP_INTERVAL=${SOCIALNET_BACKUP_INTERVAL:-3600}
      - SOCIALNET_BACKUP_KEEP=${SOCIALNET_BACKUP_KEEP:-14}
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - socialnet-data:/app/backend
      - socialnet-backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Stack Postgres : app + db liés
  socialnet-pg:
    build: .
    profiles: ["postgres"]
    ports:
      - "8000:8000"
    environment:
      - SOCIALNET_SECRET=${SOCIALNET_SECRET:-change-moi-avant-la-production}
      - SOCIALNET_BACKUP_DIR=/app/backups
      - DATABASE_URL=postgresql://socialnet:${POSTGRES_PASSWORD:-socialnet}@db:5432/socialnet
    volumes:
      - socialnet-backups:/app/backups
      - socialnet-uploads-pg:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: socialnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialnet}
      POSTGRES_DB: socialnet
    volumes:
      - socialnet-pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialnet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  socialnet-data:
  socialnet-backups:
  socialnet-pg:
  socialnet-uploads-pg:
